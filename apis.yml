aid: sertica
name: SERTICA
description: >-
  SERTICA is a maritime fleet and ship management system from RINA (originally built by
  Logimatic in Denmark, first code written in 1989), used to run planned maintenance,
  procurement, HSQE, crewing, performance, logbooks and vessel reporting across a fleet.
  It is deployed as a per-customer site rather than a shared multi-tenant service, and it
  publishes a genuinely large machine-readable contract: the SERTICA Web API is an
  OpenAPI 3.0.4 document with 2,743 paths, 3,340 operations and 1,104 schemas, served
  publicly at https://docs.sertica.com/api/swagger/v1/swagger.json and browsable in a live
  Swagger UI. It is a REST/JSON API authenticated with a 24-hour JWT obtained by posting a
  SERTICA user login to /Auth, with authorization expressed as per-user SERTICA user
  rights rather than OAuth scopes. Beyond CRUD it carries the statutory maritime surface -
  MARPOL Oil, Garbage and Ballast Water electronic record books with signing and printout
  operations, SFI-coded components, ISM management-system documents, and PunchOut/ShipServ
  procurement integration.
