apis:
  - aid: sertica:sertica
    name: SERTICA Web API
    description: >-
      The SERTICA Web API - the single REST/JSON contract behind every SERTICA module. 3,340
      operations across 254 resource families cover maintenance (components, jobs, job
      histories, counters, procedures), procurement (requisitions, requests for quote,
      purchase orders, invoices, shipments), HSQE (certificates, forms, management systems),
      performance (vessel and voyage reports) and the statutory electronic logbooks (Oil,
      Garbage and Ballast Water record books). Authentication is a 24-hour JWT issued by
      POST /Auth; every call is bound to a SERTICA user and returns only what that user's
      rights allow. Endpoints are additionally gated by product licence, so the callable
      surface differs between deployments.
    humanURL: https://www.sertica.com/modules/maintenance-api/
    baseURL: https://{sitename}.sertica.com/api
    baseURLNote: >-
      Templated on purpose. SERTICA runs a separate site per customer; the provider's own
      documentation instructs integrators to call https://<sitename>.sertica.com/api with
      their own site name. https://docs.sertica.com/api is the vendor's public API browser
      instance of the same contract.
