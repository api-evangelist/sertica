source: https://support.sertica.com/hc/en-us/sections
description: >-
  SERTICA publishes a dated release note per product release on its Zendesk help centre.
  The notes cover the whole product, and API-relevant changes appear inside them rather
  than in a separate API changelog. Recent window only; the full history back to 2025 is on
  the support site and in the "Previous versions" article.
scheme: calendar product release, 5.<year>.<release>
current_version: 5.26.9
current_version_date: '2026-08-25'
changelog_url: https://support.sertica.com/hc/en-us
previous_versions_url: https://support.sertica.com/hc/en-us/articles/27546526208157-Previous-versions
api_specific_changelog: false
api_specific_note: >-
  There is no separate API changelog and no per-operation change history. An integrator
  reading these notes has to infer contract impact from feature prose; nothing states
  which endpoints or fields changed.
entries:
- version: 5.26.9
  date: '2026-08-25'
  rollout: week 35
  url: https://support.sertica.com/hc/en-us/articles/38618932747549-Ver-5-26-9
  breaking: false
  api_relevant: true
  highlights:
  - Screens to administer and edit webhooks are now available.
  - Document sharing links to share documents outside SERTICA (requires a separate user right).
  - More Job and Component detail, including customer-defined base data fields, in mobile layout.
  - Dashboard content can be embedded as a custom card on individual screens.
- version: 5.26.7
  date: '2026-06-29'
  rollout: week 27
  url: https://support.sertica.com/hc/en-us/articles/37221528519453-Ver-5-26-7
  breaking: false
  highlights:
  - Requisitions can be created directly from the Component, Job and Item screens.
  - Evaluation Question and Answer user rights moved from the Procurement node to Address.
  - Several procurement approval and Request For Quote corrections.
- version: 5.26.6
  date: '2026-06-02'
  rollout: week 23
  url: https://support.sertica.com/hc/en-us/articles/36541018262813-Ver-5-26-6
  breaking: false
  highlights:
  - Purchase order calculation fixes - the discount column was reverted from an Amount column to a numeric percentage column, and delivery costs are now added to the overall total rather than to each position.
  - Custom Analytics Templates can be generated from a Job Request Template.
- version: 5.26.5
  date: '2026-05-06'
  rollout: week 19
  url: https://support.sertica.com/hc/en-us/articles/35885940756509-Ver-5-26-5
  breaking: false
  additions:
  - Procurement QA (new module) - supplier evaluation questions, answers and reminders.
- version: 5.26.4
  date: '2026-04-15'
  rollout: week 16
  url: https://support.sertica.com/hc/en-us/articles/35392214351773-Ver-5-26-4
  breaking: false
  highlights:
  - Batch edit of Components and document management from the Component overview grid.
- version: 5.26.3
  date: '2026-03-09'
  rollout: week 11
  url: https://support.sertica.com/hc/en-us/articles/34504961413789-Ver-5-26-3
  breaking: false
  additions:
  - Invoice Management (new module) - register invoices and attach them to purchase orders, with configurable and automated approval flows.
  - Master Data Management (new module) - central component structures shared to units.
- version: 5.26.2
  date: '2026-02-18'
  rollout: week 8
  url: https://support.sertica.com/hc/en-us/articles/34048091356445-Ver-5-26-2
  breaking: false
  highlights:
  - Saved and shared grid layouts on overview screens (requires the Customer Screen Layout user right).
- version: 5.26.1.1
  date: '2026-01-15'
  url: https://support.sertica.com/hc/en-us/articles/33242022852893-Ver-5-26-1-1
  breaking: false
  highlights:
  - Error correction - the Job history reference list on the Job screen was always empty.
