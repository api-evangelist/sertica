description: >-
  Entity graph for the SERTICA Web API, derived from the 200-response schemas of the
  top-level resource collections and from the sub-resource path segments each collection
  exposes. 254 tags and 1,104 component schemas were reduced to the core business entities
  an integration actually addresses; the full set is in the spec.
identifiers:
  style: mixed - human-readable record numbers and GUIDs
  pattern: >-
    Most entities are addressed by their business number (componentNo, jobNo, itemNo,
    documentNo, purchaseOrderNo, invoiceNo, requisitionNo, counterNo, unitNo) as a path
    parameter typed string. GUIDs are used where the record has no natural number -
    jobhistoryGuid, webhookLogGuid, propertyDefinitionGuid - and in every
    searchIndex/{guid} operation.
  note: >-
    A number is unique within a SERTICA site, not globally. Site identity is the hostname
    (https://<sitename>.sertica.com), so an integration spanning several sites must qualify
    every identifier with its site.
tenancy:
  boundary: Unit
  description: >-
    Unit is the vessel/organisational boundary that scopes visibility. GET /Auth/units
    returns the tree of Units and UnitGroups the current user can reach, and record
    visibility follows it. Sections subdivide a Unit; Companies own Units.
