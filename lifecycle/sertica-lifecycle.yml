  scheme: calendar product release, 5.<two-digit year>.<release number in year>
  current: 5.26.9
  current_source: >-
    openapi/sertica-web-api-openapi.json - assembly version strings (5.26.9.1) inside
    components.schemas, matching the published Ver. 5.26.9 release note
  changed: '2026-01'
  change_note: >-
    The version identifier advanced from 5.15.90 straight to 5.26.1 in January 2026. The
    provider states the number now reflects the release year and the release ordinal within
    that year, "making it easier to understand when a version was published".
  change_source: https://support.sertica.com/hc/en-us/articles/33235538471965-Ver-5-26-1
  api_versioning:
    style: none
    detail: >-
      The OpenAPI declares info.version "v1" and serves from the relative base /api. No path
      segment, header or query parameter selects an API version, and no second version is
      published. The API surface therefore moves with the product release.
