openapi: 3.2.0
info:
  title: SERTICA Web Accounting Dimensions Cache API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: AccountingDimensionsCache
paths:
  /AccountingDimensionsCache/affectors:
    get:
      tags:
      - AccountingDimensionsCache
      summary: Gets a list of possible Affectors
      operationId: GetAccountingDimensionAffectors
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAffector'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAffector'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAffector'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>AccountingDimension</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /AccountingDimensionsCache/affectors/search:
    post:
      tags:
      - AccountingDimensionsCache
      summary: Search for affectors Takes a SearchDefinition input, which can include filters…
      operationId: SearchAccountingDimensionAffectors
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Pagesize
        schema:
          type: integer
          format: int32
          default: 25
      requestBody:
        description: The search definition
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          application/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          text/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAffector'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAffector'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAffector'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>AccountingDimension</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /AccountingDimensionsCache/affectors/searchInfo:
    get:
      tags:
      - AccountingDimensionsCache
      summary: Returns structured information about what and how you can search for
      operationId: SearchInfoAccountingDimensionAffectors
      responses:
        '200':
          description: Returns a list of valid search fields
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
  /AccountingDimensionsCache/affectors/searchCount:
    post:
      tags:
      - AccountingDimensionsCache
      summary: Endpoint for getting searchCount on affectors
      operationId: SearchCountAccountingDimensionAffectors
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: integer
                format: int32
            application/json:
              schema:
                type: integer
                format: int32
            text/json:
              schema:
                type: integer
                format: int32
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>AccountingDimension</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /AccountingDimensionsCache/affectors/{affectorGuid}/values:
    get:
      tags:
      - AccountingDimensionsCache
      summary: Get list of values for an affector with a search criteria
      operationId: GetAffectorValues
      parameters:
      - name: affectorGuid
        in: path
        description: The affector guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.AccountingDimensionValue'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.AccountingDimensionValue'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.AccountingDimensionValue'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>AccountingDimension</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /AccountingDimensionsCache/affectors/{affectorGuid}/values/search:
    post:
      tags:
      - AccountingDimensionsCache
      summary: Get list of values for an affector with a search criteria
      operationId: SearchAffectorValues
      parameters:
      - name: affectorGuid
        in: path
        description: The affector guid
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: The search criteria
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria'
          application/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria'
          text/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.AccountingDimensionValue'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.AccountingDimensionValue'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.AccountingDimensionValue'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>AccountingDimension</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /AccountingDimensionsCache/availableValues/{objectType}:
    post:
      tags:
      - AccountingDimensionsCache
      operationId: GetAvailableValues
      parameters:
      - name: objectType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionObjectType'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo'
          application/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo'
          text/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>AccountingDimension</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get available values
      x-summary-source: derived
components:
  schemas:
    Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionUsedDimension:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        dimensionNo:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        order:
          type: integer
          format: int32
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAvailableValues:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAvailableValue'
        values:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAvailableValue'
        readOnly:
          type: boolean
        mandatory:
          type: boolean
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.ForDeviceRequest:
      type: object
      properties:
        deviceGuid:
          type:
          - string
          - 'null'
          format: uuid
        requestIdGuid:
          type:
          - string
          - 'null'
          format: uuid
        fullSynchronization:
          type: boolean
        appType:
          type: integer
          format: int32
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.View.SortDirection:
      enum:
      - Asc
      - Desc
      type: string
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfoField:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        dataType:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDataType'
        operators:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchOperator'
        enumType:
          type:
          - string
          - 'null'
        isCustomProperty:
          type: boolean
      additionalProperties: false
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchOperator:
      enum:
      - Equals
      - LessThan
      - GreaterThan
      - Like
      - Range
      - In
      - Dynamic
      - StartsWith
      - EndsWith
      - IsNull
      - NotLike
      - Or
      - NotEquals
      - NotIn
      type: string
    SerticaWebApi.Models.Accounting.AccountingDimensionValue:
      type: object
      properties:
        dimensionNo:
          type:
          - string
          - 'null'
        dimensionName:
          type:
          - string
          - 'null'
        valueNo:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        inactive:
          type:
          - boolean
          - 'null'
        externalReference:
          type:
          - string
          - 'null'
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.OrderBy:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        direction:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.View.SortDirection'
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAvailableValue:
      type: object
      properties:
        valueNo:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.ValuesMatching:
      enum:
      - All
      - One
      type: string
    Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAffector:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        dimensionNo:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        order:
          type: integer
          format: int32
        availableOnInvoice:
          type:
          - boolean
          - 'null'
        availableOnPurchaseOrderHeader:
          type:
          - boolean
          - 'null'
        availableOnPurchaseOrderPosition:
          type:
          - boolean
          - 'null'
        availableOnRequisitionHeader:
          type:
          - boolean
          - 'null'
        availableOnRequisitionPosition:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition:
      type: object
      properties:
        distinct:
          type: boolean
        subObjectsToInclude:
          type:
          - array
          - 'null'
          items:
            type: string
        contains:
          type:
          - array
          - 'null'
          items:
            type: string
        criteria:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria'
        sorting:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.OrderBy'
        columns:
          type:
          - array
          - 'null'
          items:
            type: string
        forDeviceRequest:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.ForDeviceRequest'
        unitFilter:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo:
      type: object
      properties:
        supportsContains:
          type: boolean
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfoField'
          readOnly: true
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDataType:
      enum:
      - Unkonwn
      - String
      - Int
      - Decimal
      - Enum
      - DateTime
      - Guid
      - Bool
      - Duration
      type: string
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        operator:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchOperator'
        values:
          type:
          - array
          - 'null'
          items: {}
        valuesMatching:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.ValuesMatching'
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionObjectType:
      enum:
      - PurchaseOrder
      - PurchaseOrderPosition
      - Requisition
      - RequisitionPosition
      - Invoice
      type: string
    Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionInfo:
      type: object
      properties:
        companyNo:
          type:
          - string
          - 'null'
        unitNo:
          type:
          - string
          - 'null'
        usedDimensionsOnHeader:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionUsedDimension'
        usedDimensionsOnPositions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionUsedDimension'
        dimensionValues:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAvailableValue'
        availableValues:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Accounting.AccountingDimensionAvailableValues'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
