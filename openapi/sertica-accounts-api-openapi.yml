openapi: 3.2.0
info:
  title: SERTICA Web Accounts API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: Accounts
paths:
  /Accounts:
    get:
      tags:
      - Accounts
      summary: Gets a list of Accounts
      operationId: GetAccounts
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Account</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    post:
      tags:
      - Accounts
      summary: Creates a new account record
      operationId: CreateAccount
      requestBody:
        description: The Account Object, including reference lists
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Account_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Accounts/{accountNo}:
    get:
      tags:
      - Accounts
      summary: Gets a specific Account
      operationId: GetAccount
      parameters:
      - name: accountNo
        in: path
        description: The AccountNo to get
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the requested account
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
        '400':
          description: Returns a validation result with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '404':
          description: If an account with the supplied Account No cannot be found
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Account</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    put:
      tags:
      - Accounts
      summary: Updates an existing Account
      operationId: UpdateAccount
      parameters:
      - name: accountNo
        in: path
        description: The AccountNo of the account to update
        required: true
        schema:
          type: string
      requestBody:
        description: The Account DTO object with the fields to update
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
      responses:
        '200':
          description: Returns the updated Account object
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Accounting.Account'
        '400':
          description: Returns a ValidationResult with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Account_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    delete:
      tags:
      - Accounts
      summary: Deletes a account record
      parameters:
      - name: accountNo
        in: path
        description: The AccountNo of the Account to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Account_Delete</td><td style='border-bottom:none'>Delete</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      operationId: deleteAccountsByAccountNo
      x-operation-id-source: derived
