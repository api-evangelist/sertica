          - string
          - 'null'
          format: uuid
        parentAnalyticsCustomMenuGuid:
          type:
          - string
          - 'null'
          format: uuid
        parentAnalyticsMenuGuid:
          type:
          - string
          - 'null'
          format: uuid
        menuNo:
          type:
          - string
          - 'null'
        menuType:
          $ref: '#/components/schemas/SerticaWebApi.Models.Analytics.AnalyticsMenuType'
        childItems:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Analytics.AnalyticsCustomMenu'
        deleted:
          type: boolean
        links:
          type:
          - array
          - 'null'
          items:
