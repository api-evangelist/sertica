openapi: 3.2.0
info:
  title: SERTICA Web Auth API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: Auth
paths:
  /Auth:
    get:
      tags:
      - Auth
      summary: Returns info on current user
      operationId: Get current user info
      responses:
        '200':
          description: Information about current user
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.LoggedInUser'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.LoggedInUser'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.LoggedInUser'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    post:
      tags:
      - Auth
      summary: Generates a JWT token to be used in Authorization header in subsequent requests…
      operationId: CreateJwtToken
      parameters:
      - name: lifetime
        in: query
        description: Optional token lifetime in minutes
        schema:
          type: integer
          format: int32
      requestBody:
        description: Login information about login, password, role and unit
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.SerticaUser'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.SerticaUser'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.SerticaUser'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.SerticaUser'
      responses:
        '200':
          description: Returns a token and expiration information
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
        '400':
          description: Returns a Validation Result with reasons
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
  /Auth/integrations:
    get:
      tags:
      - Auth
      summary: Returns info on configured Authentication Integrations
      operationId: AuthIntegrations
      responses:
        '200':
          description: Information about configured integrations
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.AuthenticationIntegration'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.AuthenticationIntegration'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.AuthenticationIntegration'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
  /Auth/units:
    get:
      tags:
      - Auth
      summary: Gets a Tree of Unit/UnitGroups which the current user has access to
      operationId: Get List of Units current user has access to
      responses:
        '200':
          description: Information about current user
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Security.UnitStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Security.UnitStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Security.UnitStructureNode'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Auth/userRights:
    get:
      tags:
      - Auth
      summary: Returns current user's user rights
      operationId: Get list of valid user rights for the user
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                type: array
                items:
                  type: string
            application/json:
              schema:
                type: array
                items:
                  type: string
            text/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Auth/{login}/roles:
    get:
      tags:
      - Auth
      summary: Returns a list of roles valid for the user with supplied login
      operationId: Get list of roles assigned to user
      parameters:
      - name: login
        in: path
        description: The Login to fetch roles from
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of Roles
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.LoginRole'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.LoginRole'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.LoginRole'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
  /Auth/accessToken:
    post:
      tags:
      - Auth
      operationId: CreateAccessToken
      parameters:
      - name: lifetime
        in: query
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.AccessRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.AccessRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.AccessRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.AccessRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Create access token
      x-summary-source: derived
  /Auth/fileDownloadToken:
    get:
      tags:
      - Auth
      operationId: Get a temporary token for file download
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.JwtToken'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.UnauthorizedResult'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.UnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.UnauthorizedResult'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get a temporary token for file download
      x-summary-source: derived
  /Auth/forgotPassword:
    post:
      tags:
      - Auth
      operationId: ForgotPassword
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ForgotPasswordInformation'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ForgotPasswordInformation'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ForgotPasswordInformation'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ForgotPasswordInformation'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      summary: Forgot password
      x-summary-source: derived
  /Auth/resetPassword:
    post:
      tags:
      - Auth
      operationId: ResetPassword
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPasswordInformation'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPasswordInformation'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPasswordInformation'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPasswordInformation'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      summary: Reset password
      x-summary-source: derived
  /Auth/changePassword:
    post:
      tags:
      - Auth
      operationId: ChangePassword
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ChangePasswordInformation'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ChangePasswordInformation'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ChangePasswordInformation'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ChangePasswordInformation'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Change password
      x-summary-source: derived
  /Auth/officeSiteUrl:
    get:
      tags:
      - Auth
      summary: Gets the route URL to the office site
      operationId: GetOfficeSetUrl
      responses:
        '200':
          description: Information about current user
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Link'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Link'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Link'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
  /Auth/resetPin:
    post:
      tags:
      - Auth
      operationId: ResetPin
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPinInformation'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPinInformation'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPinInformation'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Security.ResetPinInformation'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Reset pin
      x-summary-source: derived
  /Auth/totp/setup:
    post:
      tags:
      - Auth
      summary: Initiates TOTP setup for the user by generating a secret and QR code
      operationId: SetupTotp
      responses:
        '200':
          description: Returns information for authenticator app setup
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
        '400':
          description: Returns a Validation Result with reason
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Auth/totp/confirm:
    post:
      tags:
      - Auth
      summary: Confirms TOTP is setup by verifying a code from the user's authenticator app
      operationId: ConfirmTotpSetup
      requestBody:
        description: Code from authenticator app
        content:
          application/json-patch+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
          application/*+json:
            schema:
              type: string
      responses:
        '200':
          description: TOTP setup confirmed and enabled successfully
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
        '400':
          description: Returns a Validation Result with reason
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Auth/totp/recoverycodes/generate:
    post:
      tags:
      - Auth
      summary: Generates recovery codes for the user's TOTP authentication
      operationId: GenerateRecoveryCodes
      responses:
        '200':
          description: Returns a list of recovery codes
          content:
            text/plain:
              schema:
                type: array
                items:
                  type: string
            application/json:
              schema:
                type: array
                items:
                  type: string
            text/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Returns a Validation Result with reason
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Auth/totp/disable:
    delete:
      tags:
      - Auth
      summary: Disables TOTP authentication for the user
      operationId: DisableTotp
      requestBody:
        description: CCode from authenticator app
        content:
          application/json-patch+json:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
          application/*+json:
            schema:
              type: string
      responses:
        '200':
          description: TOTP authentication disabled
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Security.TotpSetup'
        '400':
          description: Returns a Validation Result with reason
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
components:
  schemas:
    SerticaWebApi.Models.Security.ChangePasswordInformation:
      type: object
      properties:
        password1:
          type:
          - string
          - 'null'
        password2:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.BrokenRule:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SerticaWebApi.Models.BrokenRuleType'
        index:
          type:
          - integer
          - 'null'
          format: int32
        objectGuid:
          type:
          - string
          - 'null'
          format: uuid
        field:
          type:
          - string
          - 'null'
        field2:
          type:
          - string
          - 'null'
        field3:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Security.ForgotPasswordInformation:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Security.AuthenticationIntegration:
      type: object
      properties:
        azureAD:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.AzureAD.AzureADInformation'
      additionalProperties: false
    SerticaWebApi.Models.ErrorReason:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        fieldName:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Security.ResetPinInformation:
      type: object
      properties:
        pin:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Security.ResetPasswordInformation:
      type: object
      properties:
        token:
          type:
          - string
          - 'null'
        password1:
          type:
          - string
          - 'null'
        password2:
          type:
          - string
          - 'null'
      additionalProperties: false
    Microsoft.AspNetCore.Mvc.UnauthorizedResult:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
      additionalProperties: false
    SerticaWebApi.Models.Security.SerticaUser:
      type: object
      properties:
        login:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
        roleNo:
          type:
          - string
          - 'null'
        unitNo:
          type:
          - string
          - 'null'
        totpCode:
          type:
          - string
          - 'null'
        recoveryCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Security.UnitNodeType:
      enum:
      - Unit
      - UnitGroup
      type: string
    SerticaWebApi.Models.Framework.LoginRole:
      type: object
      properties:
        roleNo:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        default:
          type: boolean
        updateUserNo:
          type:
          - string
          - 'null'
        updateUserName:
          type:
          - string
          - 'null'
        updateDate:
          type:
          - string
          - 'null'
          format: date-time
        createUserNo:
          type:
          - string
          - 'null'
        createUserName:
          type:
          - string
          - 'null'
        createDate:
          type:
          - string
          - 'null'
          format: date-time
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
    SerticaWebApi.Models.Security.AccessRequest:
      type: object
      properties:
        roleNo:
          type:
          - string
          - 'null'
        unitNo:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Security.UnitStructureNode:
      type: object
      properties:
        hasChildren:
          type: boolean
          readOnly: true
        name:
          type:
          - string
          - 'null'
        visibleKey:
          type:
          - string
          - 'null'
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.Security.UnitNodeType'
        selectAtLogin:
          type: boolean
        inactive:
          type: boolean
        unitGuid:
          type:
          - string
          - 'null'
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Security.UnitStructureNode'
      additionalProperties: false
    SerticaWebApi.Models.Framework.LoggedInUser:
      type: object
      properties:
        login:
