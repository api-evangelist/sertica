openapi: 3.2.0
info:
  title: SERTICA Web Certificate Tree API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: CertificateTree
paths:
  /CertificateTree:
    get:
      tags:
      - CertificateTree
      operationId: GetCertificateRootNodes
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Certificate</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get certificate root nodes
      x-summary-source: derived
  /CertificateTree/{certificateGroupId}/children:
    get:
      tags:
      - CertificateTree
      operationId: GetCertificateGroupChildren
      parameters:
      - name: certificateGroupId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Certificate</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get certificate group children
      x-summary-source: derived
components:
  schemas:
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Certificate.CertificateTreeNodeType:
      enum:
      - CertificateGroup
      - Certificate
      - Obsolete
      - Overdue
      - Due
      type: string
    SerticaWebApi.Models.Certificate.CertificateTreeNode:
      type: object
      properties:
        hasChildren:
          type: boolean
        name:
          type:
          - string
          - 'null'
        visibleKey:
          type:
          - string
          - 'null'
        alias:
          type:
          - string
          - 'null'
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNodeType'
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Certificate.CertificateTreeNode'
        certificateCount:
          type: integer
          format: int32
        sortOrder:
          type: integer
          format: int32
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
