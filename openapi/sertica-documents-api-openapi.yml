openapi: 3.2.0
info:
  title: SERTICA Web Documents API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: Documents
paths:
  /Documents:
    get:
      tags:
      - Documents
      summary: Gets a list of Documents
      operationId: GetDocuments
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Document2</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    post:
      tags:
      - Documents
      summary: Creates a new document record
      operationId: CreateDocument
      parameters:
      - name: forceAutogenerateDocumentNo
        in: query
        description: Forces API to set an autogenerated DocumentNo
        schema:
          type: boolean
          default: false
      requestBody:
        description: The Document Object, including reference lists
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Document2_Update</td><td style='border-bottom:none'>Update</td></tr><tr><td style='border-bottom:none;padding-right:5px'>JobApp</td><td style='border-bottom:none'>Function</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Documents/{documentNo}:
    get:
      tags:
      - Documents
      summary: Gets a specific Document
      operationId: GetDocument
      parameters:
      - name: documentNo
        in: path
        description: The DocumentNo to get
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the requested document
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
        '400':
          description: Returns a validation result with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '404':
          description: If a document with the supplied Document No cannot be found
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Document2</td><td style='border-bottom:none'>View</td></tr></tbody></table>
