          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    put:
      tags:
      - Documents
      summary: Updates an existing Document
      operationId: UpdateDocument
      parameters:
      - name: documentNo
        in: path
        description: The DocumentNo of the document to update
        required: true
        schema:
          type: string
      requestBody:
        description: The Document DTO object with the fields to update
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
      responses:
        '200':
          description: Returns the updated Document object
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Document.Document'
        '400':
          description: Returns a ValidationResult with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Document2_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    delete:
      tags:
      - Documents
      summary: Deletes a document record
      parameters:
      - name: documentNo
        in: path
        description: The DocumentNo of the Document to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Document2_Delete</td><td style='border-bottom:none'>Delete</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      operationId: deleteDocumentsByDocumentNo
      x-operation-id-source: derived
  /Documents/searchIndex/{documentGuid}:
