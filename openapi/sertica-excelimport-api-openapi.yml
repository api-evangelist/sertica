          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get
      x-summary-source: derived
  /ExcelImport/Validate:
    post:
      tags:
      - ExcelImport
      operationId: Validate
      requestBody:
        description: Choose the file to upload
        content:
          multipart/form-data:
            schema:
              required:
              - File
              type: object
              properties:
                File:
                  type: string
                  format: binary
        required: true
      responses:
