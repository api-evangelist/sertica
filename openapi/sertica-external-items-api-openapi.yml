openapi: 3.2.0
info:
  title: SERTICA Web External Items API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: External Items
paths:
  /ExternalItems:
    get:
      tags:
      - External Items
      summary: Gets a list of ExternalItems
      operationId: GetExternalItems
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ExternalItem</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    post:
      tags:
      - External Items
      summary: Creates a new externalItem record
      operationId: CreateExternalItem
      requestBody:
        description: The ExternalItem Object, including reference lists
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ExternalItem_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /ExternalItems/{externalItemNo}:
    get:
      tags:
      - External Items
      summary: Gets a specific ExternalItem
      operationId: GetExternalItem
      parameters:
      - name: externalItemNo
        in: path
        description: The ExternalItemNo to get
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the requested externalItem
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
        '400':
          description: Returns a validation result with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '404':
          description: If an externalItem with the supplied ExternalItem No cannot be found
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ExternalItem</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    put:
      tags:
      - External Items
      summary: Updates an existing ExternalItem
      operationId: UpdateExternalItem
      parameters:
      - name: externalItemNo
        in: path
        description: The ExternalItemNo of the externalItem to update
        required: true
        schema:
          type: string
      requestBody:
        description: The ExternalItem DTO object with the fields to update
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
      responses:
        '200':
          description: Returns the updated ExternalItem object
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ExternalItem.ExternalItem'
        '400':
          description: Returns a ValidationResult with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ExternalItem_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    delete:
      tags:
      - External Items
      summary: Deletes a externalItem record
      parameters:
      - name: externalItemNo
        in: path
        description: The ExternalItemNo of the ExternalItem to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ExternalItem_Delete</td><td style='border-bottom:none'>Delete</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      operationId: deleteExternalItemsByExternalItemNo
      x-operation-id-source: derived
