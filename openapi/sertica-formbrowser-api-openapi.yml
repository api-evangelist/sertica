openapi: 3.2.0
info:
  title: SERTICA Web Form Browser API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: FormBrowser
paths:
  /FormBrowser:
    get:
      tags:
      - FormBrowser
      operationId: FormBrowser
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Form</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Form browser
      x-summary-source: derived
  /FormBrowser/{nodeType}/children:
    post:
      tags:
      - FormBrowser
      summary: Returns the child nodes of the requested object
      operationId: GetFormBrowserChildren
      parameters:
      - name: nodeType
        in: path
        description: ''
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeType'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Form</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /FormBrowser/{nodeType}:
    post:
      tags:
      - FormBrowser
      summary: Returns the Form Browser tree from root to where the requested object is in the…
      operationId: GetTree
      parameters:
      - name: nodeType
        in: path
        description: ''
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeType'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Form</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
components:
  schemas:
    SerticaWebApi.Models.Form.FormBrowserNodeKeys:
      type: object
      properties:
        activityGroupKey:
          type:
          - string
          - 'null'
        formTemplateKey:
          type:
          - string
          - 'null'
        yearKey:
          type:
          - string
          - 'null'
        monthKey:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Form.FormBrowserNodeType:
      enum:
      - Root
      - ActivityGroup
      - FormTemplate
      - Year
      - Month
      - None
      type: string
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Form.FormBrowserNode:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        keys:
          $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeKeys'
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeType'
        unitNo:
          type:
          - string
          - 'null'
        hasParent:
          type: boolean
          readOnly: true
        parentVisibleKey:
          type:
          - string
          - 'null'
        hasChildren:
          type: boolean
        sortOrder:
          type:
          - integer
          - 'null'
          format: int32
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNode'
        childNodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.Form.FormBrowserNodeType'
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
