openapi: 3.2.0
info:
  title: SERTICA Web Grid Column Layouts API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: GridColumnLayouts
paths:
  /GridColumnLayouts/{gridKey}:
    get:
      tags:
      - GridColumnLayouts
      summary: Gets a specific Grid Column Layout
      operationId: GetGridColumnLayout
      parameters:
      - name: gridKey
        in: path
        description: The gridKey to get
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the requested grid column layout
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
        '400':
          description: Returns a validation result with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '404':
          description: If a grid column layout with the supplied Grid Key cannot be found
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    put:
      tags:
      - GridColumnLayouts
      summary: Updates an existing GridColumnLayout
      operationId: UpdateGridColumnLayout
      parameters:
      - name: gridKey
        in: path
        description: The gridKey of the gridColumnLayout to update
        required: true
        schema:
          type: string
      requestBody:
        description: The GridColumnLayout DTO object with the fields to update
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
      responses:
        '200':
          description: Returns the updated Certificate object
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
        '400':
          description: Returns a ValidationResult with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ScreenLayout_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    delete:
      tags:
      - GridColumnLayouts
      summary: Deletes a address record
      operationId: DeleteGridColumnLayout
      parameters:
      - name: gridKey
        in: path
        description: The gridKey of the GridColumnLayout to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ScreenLayout_Delete</td><td style='border-bottom:none'>Delete</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /GridColumnLayouts:
    post:
      tags:
      - GridColumnLayouts
      summary: Creates a new GridColumnLayout record
      operationId: CreateGridColumnLayout
      requestBody:
        description: The GridColumnLayout Object, including reference lists
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.GridColumnLayout'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ScreenLayout_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
components:
  schemas:
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.BrokenRule:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SerticaWebApi.Models.BrokenRuleType'
        index:
          type:
          - integer
          - 'null'
          format: int32
        objectGuid:
          type:
          - string
          - 'null'
          format: uuid
        field:
          type:
          - string
          - 'null'
        field2:
          type:
          - string
          - 'null'
        field3:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.ErrorReason:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        fieldName:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.ValidationResult:
      type: object
      properties:
        isValid:
          type: boolean
          readOnly: true
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.ErrorReason'
          readOnly: true
        brokenRules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.BrokenRule'
          readOnly: true
        subResults:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
          readOnly: true
      additionalProperties: false
    SerticaWebApi.Models.GridColumnLayout:
      type: object
      properties:
        gridKey:
          type:
          - string
          - 'null'
        dynamicGridSetup: {}
        overwritePersonalLayouts:
          type: boolean
        unitNo:
          type:
          - string
          - 'null'
        unitName:
          type:
          - string
          - 'null'
        updateUserNo:
          type:
          - string
          - 'null'
        updateUserName:
          type:
          - string
          - 'null'
        updateDate:
          type:
          - string
          - 'null'
          format: date-time
        createUserNo:
          type:
          - string
          - 'null'
        createUserName:
          type:
          - string
          - 'null'
        createDate:
          type:
          - string
          - 'null'
          format: date-time
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
    SerticaWebApi.Models.BrokenRuleType:
      enum:
      - Default
      - ShouldBeFilled
      - Information
      - Warning
      - Error
      - Delete
      type: string
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
