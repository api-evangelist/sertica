    post:
      tags:
      - IosDataSync
      operationId: ResetObjectIosDataSync
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Framework.IosDataSyncResetObject'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Framework.IosDataSyncResetObject'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Framework.IosDataSyncResetObject'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Framework.IosDataSyncResetObject'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.IosDataSyncResetObject'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.IosDataSyncResetObject'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Framework.IosDataSyncResetObject'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>JobApp</td><td style='border-bottom:none'>Function</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Reset object ios data sync
      x-summary-source: derived
components:
