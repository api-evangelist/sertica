openapi: 3.2.0
info:
  title: SERTICA Web Item Group Selection API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: ItemGroupSelection
paths:
  /ItemGroupSelection/{itemGroupNo}:
    get:
      tags:
      - ItemGroupSelection
      operationId: GetItemGroupSelection
      parameters:
      - name: itemGroupNo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ItemGroupSelectionTree.ItemGroupSelection'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ItemGroupSelectionTree.ItemGroupSelection'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ItemGroupSelectionTree.ItemGroupSelection'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>UnitSparePartGroups</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get item group selection
      x-summary-source: derived
  /ItemGroupSelection/{itemGroupNo}/history:
    get:
      tags:
      - ItemGroupSelection
      operationId: GetItemGroupSelectionHistory
      parameters:
      - name: itemGroupNo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemGroupSelectionTree.ItemGroupSelection'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemGroupSelectionTree.ItemGroupSelection'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemGroupSelectionTree.ItemGroupSelection'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '404':
          description: Not Found
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>UnitSparePartGroups</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get item group selection history
      x-summary-source: derived
