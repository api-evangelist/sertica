openapi: 3.2.0
info:
  title: SERTICA Web Item Location Tree API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: ItemLocationTree
paths:
  /ItemLocationTree:
    get:
      tags:
      - ItemLocationTree
      operationId: ItemLocationTree
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePartBrowser</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Item location tree
      x-summary-source: derived
  /ItemLocationTree/{nodeType}/{visibleKey}/children:
    get:
      tags:
      - ItemLocationTree
      operationId: GetItemLocationTreeChildren
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNodeType'
      - name: visibleKey
        in: path
        required: true
        schema:
          type: string
      - name: unitNo
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePartBrowser</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get item location tree children
      x-summary-source: derived
  /ItemLocationTree/{nodeType}/{visibleKey}:
    get:
      tags:
      - ItemLocationTree
      operationId: GetItemLocationTreeFromNode
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNodeType'
      - name: visibleKey
        in: path
        required: true
        schema:
          type: string
      - name: parentWarehouseKey
        in: query
        schema:
          type: string
      - name: parentItemLocationKey
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePartBrowser</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get item location tree from node
      x-summary-source: derived
components:
  schemas:
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNodeType:
      enum:
      - Warehouse
      - ItemLocation
      - Item
      type: string
    SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode:
      type: object
      properties:
        hasChildren:
          type: boolean
        name:
          type:
          - string
          - 'null'
        visibleKey:
          type:
          - string
          - 'null'
        parentVisibleKey:
          type:
          - string
          - 'null'
        unitNo:
          type:
          - string
          - 'null'
        warehouseNo:
          type:
          - string
          - 'null'
        warehouseName:
          type:
          - string
          - 'null'
        locationNo:
          type:
          - string
          - 'null'
        locationName:
          type:
          - string
          - 'null'
        qrCode:
          type:
          - string
          - 'null'
        standardSupplierItemNo:
          type:
          - string
          - 'null'
        stock:
          type:
          - number
          - 'null'
          format: double
        warehouseNoNameStructure:
          type:
          - string
          - 'null'
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNodeType'
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.ItemLocationTree.ItemLocationTreeNode'
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
