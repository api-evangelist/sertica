        required: true
        schema:
          type: string
      requestBody:
        description: The Item DTO object with the fields to update
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Item.Item'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Item.Item'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Item.Item'
          application/*+json:
