openapi: 3.2.0
info:
  title: SERTICA Web Item Tree API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: ItemTree
paths:
  /ItemTree:
    get:
      tags:
      - ItemTree
      operationId: ItemTree
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePartTree</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Item tree
      x-summary-source: derived
  /ItemTree/{nodeType}/{visibleKey}/children:
    get:
      tags:
      - ItemTree
      operationId: GetItemTreeChildren
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNodeType'
      - name: visibleKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePartTree</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get item tree children
      x-summary-source: derived
  /ItemTree/{nodeType}/{visibleKey}:
    get:
      tags:
      - ItemTree
      operationId: GetItemTreeFromNode
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNodeType'
      - name: visibleKey
        in: path
        required: true
        schema:
          type: string
      - name: parentGroupKey
        in: query
        schema:
          type: string
      - name: parentItemKey
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePartTree</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get item tree from node
      x-summary-source: derived
components:
  schemas:
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.Item.ItemTreeNodeType:
      enum:
      - Item
      - ItemGroup
      - ItemSupplier
      type: string
    SerticaWebApi.Models.Item.ItemTreeNode:
      type: object
      properties:
        hasChildren:
          type: boolean
        name:
          type:
          - string
          - 'null'
        visibleKey:
          type:
          - string
          - 'null'
        parentVisibleKey:
          type:
          - string
          - 'null'
        unitNo:
          type:
          - string
          - 'null'
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNodeType'
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemTreeNode'
        hasParent:
          type: boolean
          readOnly: true
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
