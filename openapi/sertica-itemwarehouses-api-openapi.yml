openapi: 3.2.0
info:
  title: SERTICA Web Item Warehouses API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: ItemWarehouses
paths:
  /ItemWarehouses/search:
    post:
      tags:
      - ItemWarehouses
      summary: Search for itemWarehouses Takes a SearchDefinition input, which can include…
      operationId: SearchItemWarehouses
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Pagesize
        schema:
          type: integer
          format: int32
          default: 25
      requestBody:
        description: The search definition
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          application/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          text/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemWarehouse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemWarehouse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Item.ItemWarehouse'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePart</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /ItemWarehouses/searchInfo:
    get:
      tags:
      - ItemWarehouses
      summary: Returns structured information about what and how you can search for
      operationId: SearchInfoItemWarehouses
      responses:
        '200':
          description: Returns a list of valid search fields
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo'
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
  /ItemWarehouses/searchCount:
    post:
      tags:
      - ItemWarehouses
      summary: Returns number of hits in a search for Items Takes a SearchDefinition input…
      operationId: SearchCountItemWarehouses
      requestBody:
        description: The search definition
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          application/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          text/json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: integer
                format: int32
            application/json:
              schema:
                type: integer
                format: int32
            text/json:
              schema:
                type: integer
                format: int32
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>SparePart</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
components:
  schemas:
    Logihold.BusinessObjects.LogiholdObjModel.Search.ForDeviceRequest:
      type: object
      properties:
        deviceGuid:
          type:
          - string
          - 'null'
          format: uuid
        requestIdGuid:
          type:
          - string
          - 'null'
          format: uuid
        fullSynchronization:
          type: boolean
        appType:
          type: integer
          format: int32
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfoField:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        dataType:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDataType'
        operators:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchOperator'
        enumType:
          type:
          - string
          - 'null'
        isCustomProperty:
          type: boolean
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.View.SortDirection:
      enum:
      - Asc
      - Desc
      type: string
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchOperator:
      enum:
      - Equals
      - LessThan
      - GreaterThan
      - Like
      - Range
      - In
      - Dynamic
      - StartsWith
      - EndsWith
      - IsNull
      - NotLike
      - Or
      - NotEquals
      - NotIn
      type: string
    SerticaWebApi.Models.Framework.Amount:
      type: object
      properties:
        value:
          type: number
          format: double
        currencyNo:
          type:
          - string
          - 'null'
        decimalPlaces:
          type: integer
          format: int32
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.OrderBy:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        direction:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.View.SortDirection'
      additionalProperties: false
    SerticaWebApi.Models.Item.ItemWarehouse:
      type: object
      properties:
        warehouseNo:
          type:
          - string
          - 'null'
        warehouseName:
          type:
          - string
          - 'null'
        standardWarehouse:
          type:
          - boolean
          - 'null'
        locationNo:
          type:
          - string
          - 'null'
        locationName:
          type:
          - string
          - 'null'
        stock:
          type:
          - number
          - 'null'
          format: double
        maximumStock:
          type:
          - number
          - 'null'
          format: double
        minimumStock:
          type:
          - number
          - 'null'
          format: double
        stockValue:
          $ref: '#/components/schemas/SerticaWebApi.Models.Framework.Amount'
        itemNo:
          type:
          - string
          - 'null'
        itemName:
          type:
          - string
          - 'null'
        qrCode:
          type:
          - string
          - 'null'
        standardCurrency:
          type:
          - string
          - 'null'
        itemCurrency:
          type:
          - string
          - 'null'
        lowOnStock:
          type:
          - boolean
          - 'null'
        location:
          type:
          - string
          - 'null'
        unitNo:
          type:
          - string
          - 'null'
        unitName:
          type:
          - string
          - 'null'
        itemUnitNo:
          type:
          - string
          - 'null'
        itemUnitName:
          type:
          - string
          - 'null'
        itemGuid:
          type: string
          format: uuid
        standardSupplierItemNo:
          type:
          - string
          - 'null'
        measureUnitNo:
          type:
          - string
          - 'null'
        warehouseNoNameStructure:
          type:
          - string
          - 'null'
        lastManualStockAdjustment:
          type:
          - string
          - 'null'
          format: date-time
        guidForReferencedObject:
          type:
          - string
          - 'null'
          format: uuid
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDataType:
      enum:
      - Unkonwn
      - String
      - Int
      - Decimal
      - Enum
      - DateTime
      - Guid
      - Bool
      - Duration
      type: string
    Logihold.BusinessObjects.LogiholdObjModel.Search.ValuesMatching:
      enum:
      - All
      - One
      type: string
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchDefinition:
      type: object
      properties:
        distinct:
          type: boolean
        subObjectsToInclude:
          type:
          - array
          - 'null'
          items:
            type: string
        contains:
          type:
          - array
          - 'null'
          items:
            type: string
        criteria:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria'
        sorting:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.OrderBy'
        columns:
          type:
          - array
          - 'null'
          items:
            type: string
        forDeviceRequest:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.ForDeviceRequest'
        unitFilter:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfo:
      type: object
      properties:
        supportsContains:
          type: boolean
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchInfoField'
          readOnly: true
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.Search.SearchCriteria:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        operator:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.SearchOperator'
        values:
          type:
          - array
          - 'null'
          items: {}
        valuesMatching:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.Search.ValuesMatching'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
