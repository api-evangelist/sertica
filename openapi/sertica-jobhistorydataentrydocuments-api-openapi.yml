        '403':
          description: Customer must have one of these License values set<table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>JobHistoryDataEntryWeb</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      x-summary-source: derived
    post:
      tags:
      - JobHistoryDataEntryDocuments
      operationId: JobHistoryDataEntryAddDocumentFile
      parameters:
      - name: documentNo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Choose the file to upload
        content:
          multipart/form-data:
            schema:
              required:
              - File
              type: object
              properties:
                File:
                  type: string
                  format: binary
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
