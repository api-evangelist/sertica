          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.SystemManagement.LogEntry'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.SystemManagement.LogEntry'
      responses:
