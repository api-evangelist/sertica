          - 'null'
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementTaskType:
      enum:
      - UpdateUnits
      - CopyUnit
      type: string
    SerticaWebApi.Models.MasterDataManagementModels.ApiUpdateUnitsResult:
      type: object
      properties:
        success:
