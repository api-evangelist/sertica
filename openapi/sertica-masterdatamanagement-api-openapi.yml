          - string
          - 'null'
        unitName:
          type:
          - string
          - 'null'
        masterObjectComponentNo:
          type:
          - string
          - 'null'
        masterObjectComponentName:
          type:
          - string
          - 'null'
        unitComponentNo:
          type:
          - string
          - 'null'
        unitComponentName:
          type:
          - string
          - 'null'
        updateUserNo:
          type:
          - string
          - 'null'
        updateUserName:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        children:
          type:
          - array
          - 'null'
          items:
