components:
  schemas:
    Logihold.BusinessObjects.LogiholdObjModel.SystemData_TaskStatus:
      enum:
      - Inactive
      - Waiting
      - Running
      - Completed
      - Failed
      - Cancelled
      - LockedOut
      type: string
    SerticaWebApi.Models.BrokenRule:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SerticaWebApi.Models.BrokenRuleType'
        index:
          type:
          - integer
          - 'null'
          format: int32
        objectGuid:
          type:
          - string
          - 'null'
          format: uuid
        field:
          type:
          - string
          - 'null'
        field2:
          type:
          - string
          - 'null'
        field3:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.ErrorReason:
      type: object
      properties:
        text:
          type:
          - string
          - 'null'
        fieldName:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.MasterDataManagementModels.ApiUpdateUnitsArguments:
      type: object
      properties:
        userNo:
          type:
          - string
          - 'null'
        selectedPackageUnitInstances:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.ApiSelectedPackageUnitInstance'
        duplicateJobsActions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.ApiDuplicateJobsAction'
      additionalProperties: false
    SerticaWebApi.Models.MasterDataManagementModels.MasterDataManagementTask:
      type: object
      properties:
        tsTaskTaskNo:
          type:
          - string
          - 'null'
        tsTaskRunTime:
          type:
          - string
          - 'null'
          format: date-time
        tsTaskNextRunTime:
          type:
          - string
          - 'null'
          format: date-time
        tsTaskActivated:
          type:
          - boolean
          - 'null'
        tsTaskDescription:
          type:
          - string
          - 'null'
        tsTaskTaskStatus:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.SystemData_TaskStatus'
        name:
          type:
          - string
          - 'null'
        taskNo:
          type:
          - string
          - 'null'
        taskType:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementTaskType'
        taskArguments: {}
        status:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementTaskStatus'
        progressText:
          type:
          - string
          - 'null'
        updateUserNo:
          type:
          - string
          - 'null'
        updateUserName:
          type:
          - string
          - 'null'
        updateDate:
          type:
          - string
          - 'null'
          format: date-time
        createUserNo:
          type:
          - string
          - 'null'
        createUserName:
          type:
          - string
          - 'null'
        createDate:
          type:
          - string
          - 'null'
          format: date-time
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
    SerticaWebApi.Models.MasterDataManagementModels.ApiDuplicateJobsAction:
