        name:
          type:
          - string
          - 'null'
        taskNo:
          type:
          - string
          - 'null'
        taskType:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementTaskType'
        taskArguments: {}
        status:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementTaskStatus'
        progressText:
          type:
          - string
          - 'null'
        updateUserNo:
          type:
          - string
          - 'null'
        updateUserName:
          type:
          - string
          - 'null'
        updateDate:
          type:
          - string
          - 'null'
          format: date-time
        createUserNo:
          type:
          - string
          - 'null'
        createUserName:
          type:
          - string
          - 'null'
        createDate:
          type:
          - string
          - 'null'
          format: date-time
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
