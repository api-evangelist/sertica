          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.View.SortDirection'
      additionalProperties: false
    SerticaWebApi.Models.MasterDataManagementModels.MasterDataManagementTask:
      type: object
      properties:
        tsTaskTaskNo:
          type:
          - string
          - 'null'
        tsTaskRunTime:
          type:
          - string
          - 'null'
