        tsTaskNextRunTime:
          type:
          - string
          - 'null'
          format: date-time
        tsTaskActivated:
          type:
          - boolean
          - 'null'
        tsTaskDescription:
          type:
          - string
          - 'null'
        tsTaskTaskStatus:
