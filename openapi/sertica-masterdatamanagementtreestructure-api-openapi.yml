openapi: 3.2.0
info:
  title: SERTICA Web Master Data Management Tree Structure API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: MasterDataManagementTreeStructure
paths:
  /MasterDataManagementTreeStructure:
    get:
      tags:
      - MasterDataManagementTreeStructure
      operationId: GetMDMRootNodes
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>MasterDataManagement</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get MDM root nodes
      x-summary-source: derived
  /MasterDataManagementTreeStructure/{nodeType}/{visibleKey}/children:
    get:
      tags:
      - MasterDataManagementTreeStructure
      operationId: GetMDMChildren
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMNodeType'
      - name: visibleKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>MasterDataManagement</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get MDM children
      x-summary-source: derived
  /MasterDataManagementTreeStructure/{nodeType}/{visibleKey}:
    get:
      tags:
      - MasterDataManagementTreeStructure
      summary: Returns a tree structure from root to where the requested object is in the tree…
      operationId: FindMDMNodeInTree
      parameters:
      - name: nodeType
        in: path
        description: ''
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMNodeType'
      - name: visibleKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>MasterDataManagement</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /MasterDataManagementTreeStructure/{componentNo}/componenttree:
    get:
      tags:
      - MasterDataManagementTreeStructure
      summary: Gets the full child component tree for the specified component no
      operationId: GetAllComponentNodeChildren
      parameters:
      - name: componentNo
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>MasterDataManagement</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /MasterDataManagementTreeStructure/{componentNo}/instances:
    get:
      tags:
      - MasterDataManagementTreeStructure
      operationId: GetUnitComponentInstances
      parameters:
      - name: componentNo
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementModels.MDMComponentInstanceView'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementModels.MDMComponentInstanceView'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementModels.MDMComponentInstanceView'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>MasterDataManagement</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get unit component instances
      x-summary-source: derived
components:
  schemas:
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.MasterDataManagementModels.MDMNodeType:
      enum:
      - BaseComponent
      - Component
      - JobFolder
      - Job
      - RecurringJobFolder
      - RecurringJob
      - RunOnceJobFolder
      - RunOnceJob
      - ComponentItemFolder
      - ComponentItem
      - JobResourceFolder
      - JobResource
      - ComponentDocumentFolder
      - ComponentDocument2Link
      - JobDocumentFolder
      - JobDocument2Link
      - JobProcedureFolder
      - JobProcedure
      type: string
    SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode:
      type: object
      properties:
        parentComponentGuid:
          type:
          - string
          - 'null'
        componentName:
          type:
          - string
          - 'null'
        hasChildren:
          type: boolean
          readOnly: true
        name:
          type:
          - string
          - 'null'
        visibleKey:
          type:
          - string
          - 'null'
        defaultComponentNo:
          type:
          - string
          - 'null'
        critical:
          type: boolean
        disabled:
          type: boolean
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMNodeType'
        hasComponents:
          type:
          - boolean
          - 'null'
        hasJobs:
          type:
          - boolean
          - 'null'
        hasItems:
          type:
          - boolean
          - 'null'
        hasDocuments:
          type:
          - boolean
          - 'null'
        hasProcedures:
          type:
          - boolean
          - 'null'
        hasResources:
          type:
          - boolean
          - 'null'
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.MasterDataManagementModels.MDMTreeStructureNode'
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
    Logihold.BusinessObjects.LogiholdObjModel.MasterDataManagementModels.MDMComponentInstanceView:
      type: object
      properties:
        unit:
          type:
          - string
          - 'null'
        unitComponentInfo:
          type:
          - string
          - 'null'
        serialNo:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
