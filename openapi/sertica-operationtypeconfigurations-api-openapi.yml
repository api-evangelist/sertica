          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
      responses:
        '200':
          description: Returns the updated OperationTypeConfiguration object
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
            application/json:
              schema:
                type: array
                items:
