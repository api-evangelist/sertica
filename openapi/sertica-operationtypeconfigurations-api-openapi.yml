openapi: 3.2.0
info:
  title: SERTICA Web Operation Type Configurations API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: OperationTypeConfigurations
paths:
  /OperationTypeConfigurations:
    get:
      tags:
      - OperationTypeConfigurations
      summary: Gets a list of OperationTypeConfigurations
      operationId: GetOperationTypeConfigurations
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>OperationTypeConfiguration</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /OperationTypeConfigurations/{operationType}:
    get:
      tags:
      - OperationTypeConfigurations
      summary: Gets a specific OperationTypeConfiguration
      operationId: GetOperationTypeConfiguration
      parameters:
      - name: operationType
        in: path
        description: The operationType to get
        required: true
        schema:
          $ref: '#/components/schemas/Logihold.BusinessObjects.LogiholdObjModel.ElectronicLogbook.Shared.Models.Operations.OperationType'
      responses:
        '200':
          description: Returns the requested operationTypeConfiguration
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
        '400':
          description: Returns a validation result with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '404':
          description: If an operationTypeConfiguration with the supplied OperationTypeConfiguration No cannot be found
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>OperationTypeConfiguration</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /OperationTypeConfigurations/Update:
    post:
      tags:
      - OperationTypeConfigurations
      summary: Bulk Updates a list of OperationTypeConfiguration
      operationId: BulkUpdateOperationTypeConfiguration
      requestBody:
        description: The list of OperationTypeConfigurations DTO object with the fields to update
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SerticaWebApi.Models.ElectronicLogBook.OperationTypeConfiguration'
          application/json:
            schema:
              type: array
              items:
