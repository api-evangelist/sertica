            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.SystemOptions.Options'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.SystemOptions.Options'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
