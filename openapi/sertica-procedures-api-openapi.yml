openapi: 3.2.0
info:
  title: SERTICA Web Procedures API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: Procedures
paths:
  /Procedures:
    get:
      tags:
      - Procedures
      summary: Gets a list of Procedures
      operationId: GetProcedures
      parameters:
      - name: page
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: ''
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Procedure</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    post:
      tags:
      - Procedures
      summary: Creates a new procedure record
      operationId: CreateProcedure
      requestBody:
        description: The Procedure Object, including reference lists
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Procedure_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /Procedures/{procedureNo}:
    get:
      tags:
      - Procedures
      summary: Gets a specific Procedure
      operationId: GetProcedure
      parameters:
      - name: procedureNo
        in: path
        description: The ProcedureNo to get
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the requested procedure
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
        '400':
          description: Returns a validation result with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '404':
          description: If an procedure with the supplied Procedure No cannot be found
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Procedure</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    put:
      tags:
      - Procedures
      summary: Updates an existing Procedure
      operationId: UpdateProcedure
      parameters:
      - name: procedureNo
        in: path
        description: The ProcedureNo of the procedure to update
        required: true
        schema:
          type: string
      requestBody:
        description: The Procedure DTO object with the fields to update
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
      responses:
        '200':
          description: Returns the updated Procedure object
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.Procedure.Procedure'
        '400':
          description: Returns a ValidationResult with information about the bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Procedure_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    delete:
      tags:
      - Procedures
      summary: Deletes a procedure record
      parameters:
      - name: procedureNo
        in: path
        description: The ProcedureNo of the Procedure to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Procedure_Delete</td><td style='border-bottom:none'>Delete</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      operationId: deleteProceduresByProcedureNo
      x-operation-id-source: derived
