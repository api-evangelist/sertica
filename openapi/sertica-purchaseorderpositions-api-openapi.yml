      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: integer
                format: int32
            application/json:
              schema:
                type: integer
                format: int32
            text/json:
              schema:
                type: integer
                format: int32
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>PurchaseOrder</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /PurchaseOrderPositions/searchIndex/{requisitionPositionGuid}:
    post:
      tags:
      - PurchaseOrderPositions
      summary: Get index of a record in a search for PurchaseOrder Positions Takes a…
      operationId: SearchIndexPurchaseOrderPositions
      parameters:
      - name: requisitionPositionGuid
        in: path
        description: The requisition to get index for
        required: true
        schema:
