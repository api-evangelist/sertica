    get:
      tags:
      - ScreenLayouts
      summary: Get a list of screenLayouts
      operationId: GetScreenLayouts
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
        '401':
          description: If user is unauthorized
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
    post:
      tags:
      - ScreenLayouts
      summary: Creates a new ScreenLayout record
      operationId: CreateScreenLayout
      requestBody:
        description: The ScreenLayout DTO object to create
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.ValidationResult'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>ScreenLayout_Update</td><td style='border-bottom:none'>Update</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
  /ScreenLayouts/{screenLayoutKey}:
    get:
      tags:
      - ScreenLayouts
      summary: Gets a specific ScreenLayout
      operationId: GetScreenLayout
      parameters:
      - name: screenLayoutKey
        in: path
        description: The Key of the ScreenLayout object
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the requested ScreenLayout
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
            application/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
            text/json:
              schema:
                $ref: '#/components/schemas/SerticaWebApi.Models.CustomLayout.ScreenLayout'
        '400':
