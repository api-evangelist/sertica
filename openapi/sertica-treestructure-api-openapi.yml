openapi: 3.2.0
info:
  title: SERTICA Web Tree Structure API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: TreeStructure
paths:
  /TreeStructure:
    get:
      tags:
      - TreeStructure
      operationId: GetRootNodes
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Tree</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get root nodes
      x-summary-source: derived
  /TreeStructure/{nodeType}/{visibleKey}/children:
    get:
      tags:
      - TreeStructure
      operationId: GetChildren
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.NodeType'
      - name: visibleKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Tree</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      summary: Get children
      x-summary-source: derived
  /TreeStructure/{nodeType}/{visibleKey}:
    get:
      tags:
      - TreeStructure
      summary: Returns a tree structure from root to where the requested object is in the tree…
      operationId: FindNodeInTree
      parameters:
      - name: nodeType
        in: path
        description: ''
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.NodeType'
      - name: visibleKey
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>Tree</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
components:
  schemas:
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.TreeStructure.NodeType:
      enum:
      - Component
      - DisabledComponent
      - JobFolder
      - Job
      - RecurringJobFolder
      - RecurringJob
      - RunOnceJobFolder
      - RunOnceJob
      - JobHistoryYear
      - JobHistory
      type: string
    SerticaWebApi.Models.TreeStructure.TreeStructureNode:
      type: object
      properties:
        hasChildren:
          type: boolean
        name:
          type:
          - string
          - 'null'
        visibleKey:
          type:
          - string
          - 'null'
        critical:
          type: boolean
        disabled:
          type:
          - boolean
          - 'null'
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.NodeType'
        excludeFromJobUse:
          type: boolean
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.TreeStructure.TreeStructureNode'
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
