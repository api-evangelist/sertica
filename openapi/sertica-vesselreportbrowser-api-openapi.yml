openapi: 3.2.0
info:
  title: SERTICA Web Vessel Report Browser API
  description: 'Online API browser for SERTICA Web API.


    Be aware that some endpoints are restricted by license or user rights and may not be available in your environment.


    Each endpoint includes a description of the required license and user rights.'
  version: v1
servers:
- url: /api
tags:
- name: VesselReportBrowser
paths:
  /VesselReportBrowser:
    get:
      tags:
      - VesselReportBrowser
      summary: Get vessel report browser root nodes
      operationId: GetVesselReportBrowserRootNodes
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>VesselReport</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      x-summary-source: derived
  /VesselReportBrowser/{nodeType}/children:
    post:
      tags:
      - VesselReportBrowser
      summary: Get vessel report browser children
      operationId: GetVesselReportBrowserChildren
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeType'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>VesselReport</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      x-summary-source: derived
  /VesselReportBrowser/{nodeType}:
    post:
      tags:
      - VesselReportBrowser
      summary: Get vessel report browser tree
      operationId: GetVesselReportBrowserTree
      parameters:
      - name: nodeType
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeType'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
          application/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
          text/json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
        '401':
          description: If user is unauthorized
        '403':
          description: User must have one of these User Rights</br><table><thead><tr><th>Key</th><th>Right</th></tr></thead><tbody><tr><td style='border-bottom:none;padding-right:5px'>VesselReport</td><td style='border-bottom:none'>View</td></tr></tbody></table>
        '500':
          description: The api has encountered an unhandled exception. See Sertica logs for details
      security:
      - Bearer: []
      x-summary-source: derived
components:
  schemas:
    SerticaWebApi.Models.Link:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys:
      type: object
      properties:
        vesselReportTypeKey:
          type:
          - string
          - 'null'
        yearKey:
          type:
          - string
          - 'null'
        monthKey:
          type:
          - string
          - 'null'
      additionalProperties: false
    SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        keys:
          $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeKeys'
        nodeType:
          $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeType'
        unitNo:
          type:
          - string
          - 'null'
        hasChildren:
          type: boolean
        sortOrder:
          type:
          - integer
          - 'null'
          format: int32
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNode'
        guid:
          type:
          - string
          - 'null'
          format: uuid
        liveObjectGuid:
          type:
          - string
          - 'null'
          format: uuid
        unitGuid:
          type:
          - string
          - 'null'
          format: uuid
        deleted:
          type: boolean
        latestHistoryGuid:
          type:
          - string
          - 'null'
          format: uuid
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SerticaWebApi.Models.Link'
          readOnly: true
      additionalProperties: false
    SerticaWebApi.Models.WebVesselReportingSystem.VesselReportBrowserNodeType:
      enum:
      - Root
      - VesselReportType
      - Year
      - Month
      - None
      type: string
  securitySchemes:
    Bearer:
      type: http
      description: JWT Authorization header using the Bearer scheme
      scheme: bearer
