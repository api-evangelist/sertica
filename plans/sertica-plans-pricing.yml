pricing_model:
  style: enterprise, contact-sales, module-licensed
  unit: per vessel / per site, module-based
  published_price: false
  free_tier: false
  self_serve_signup: false
  trial: not published
licensing_note: >-
  The API is gated by product licence AND by user rights, and the contract says so itself:
  info.description warns that "some endpoints are restricted by license or user rights and
  may not be available in your environment", and 3,028 of 3,340 operations declare a 403
  naming the specific user right required. Two callers on the same version of SERTICA can
  therefore see materially different API surfaces.
