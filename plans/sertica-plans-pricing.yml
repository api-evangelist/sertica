description: >-
  SERTICA publishes no pricing for the Maintenance API or for the SERTICA platform. The API
  is sold as a licensed MODULE of a per-vessel SERTICA deployment, and every published route
  to a price is a contact form. This file records that measured absence.
plan_count: 0
