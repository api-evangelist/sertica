third_party_estimates_note: >-
  Software directories publish estimated ranges for SERTICA. Those are third-party
  guesses, not provider-published prices, and are deliberately NOT recorded as plans here.
previous_content_note: >-
  This file previously held three scaffold tiers (Free / Professional / Enterprise with
  1,000 and 100,000 request quotas) written by a 2026-05-04 bulk sweep and marked
  method: generated. SERTICA publishes no such tiers and the API is not metered by request
  count. The scaffold was replaced on 2026-08-27 with this searched, evidenced record.
